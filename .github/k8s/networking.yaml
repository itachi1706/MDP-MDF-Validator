apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scse-mdp-validator-http-route
  labels:
    app.kubernetes.io/name: "mdp-validator"
    app.kubernetes.io/instance: "mdp-validator-prod"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: "http-route-internal"
    app.kubernetes.io/part-of: "mdp-validator"
    app.kubernetes.io/managed-by: "argo"
  annotations:
    link.argocd.argoproj.io/external-link: https://scse-mdp-validator.itachi1706.dev
    external-dns.kubernetes.io/cloudflare-proxied: 'true'
spec:
  parentRefs:
    - name: main-cf-gateway
      namespace: kube-networking
  hostnames:
    - "scse-mdp-validator.itachi1706.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scse-mdp-validator-svc
          port: 80