apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scse-mdp-validator-http-route
  labels:
    app.kubernetes.io/name: "mdp-validator"
    app.kubernetes.io/instance: "mdp-validator-prod"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: "http-route-internal"
    app.kubernetes.io/part-of: "mdp-validator"
    app.kubernetes.io/managed-by: "argo"
  annotations:
    link.argocd.argoproj.io/external-link: https://scse-mdp-validator.itachi1706.dev
    external-dns.kubernetes.io/cloudflare-proxied: 'true'
spec:
  parentRefs:
    - name: main-cf-gateway
      namespace: kube-networking
  hostnames:
    - "scse-mdp-validator.itachi1706.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scse-mdp-validator-svc
          port: 80
---
# External
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.kubernetes.io/cloudflare-proxied: 'true'
  labels:
    app.kubernetes.io/name: "mdp-validator"
    app.kubernetes.io/instance: "mdp-validator-prod"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: "listenerset"
    app.kubernetes.io/part-of: "mdp-validator"
    app.kubernetes.io/managed-by: "argo"
  name: scse-mdp-validator-https-listener
spec:
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: mdpvalidator.itachi1706.com
      name: scse-mdp-validator-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ''
            kind: Secret
            name: scse-mdp-validator-prd-tls
        mode: Terminate
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cilium-gateway
    namespace: kube-networking
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: 'true'
  labels:
    app.kubernetes.io/name: "mdp-validator"
    app.kubernetes.io/instance: "mdp-validator-prod"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: "http-route-external"
    app.kubernetes.io/part-of: "mdp-validator"
    app.kubernetes.io/managed-by: "argo"
  name: scse-mdp-validator-ext-route
spec:
  hostnames:
    - mdpvalidator.itachi1706.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: scse-mdp-validator-https-listener
      sectionName: scse-mdp-validator-https
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: scse-mdp-validator-svc
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /